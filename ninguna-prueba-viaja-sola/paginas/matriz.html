<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>matriz · ninguna prueba viaja sola</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/regimes.css">
<link rel="stylesheet" href="../css/print.css">
<style>
  .lienzo-matriz { height: min(72svh, 46rem); }
  .mensaje-bits {
    font-family: "Monitor", ui-monospace, monospace;
    font-size: clamp(.6rem, 1.5vw, .9rem);
    line-height: 1.35; word-break: break-all; opacity: .7; max-width: 60em;
  }
  .mensaje-bits b { color: var(--c-perdida); font-weight: 400; }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23222'/%3E%3C/svg%3E">
</head>
<body data-pagina="matriz" class="pagina-matriz">

<header class="cabeza"><p class="marca"><a href="../index.html">ninguna prueba viaja sola</a> · matriz</p></header>
<div class="telemetria" data-telemetria aria-label="telemetría de la señal"></div>

<main class="ancho">
  <h1 class="monumento desborde">1001</h1>
  <p class="subtitulo">el recorrido escrito en doce columnas · tocar un bit lo cambia</p>

  <canvas class="lienzo-matriz" id="matriz" aria-label="matriz binaria de los recuerdos"></canvas>
  <p class="distancia-min" id="dmin"></p>
  <p class="medida" id="nota" aria-live="polite">cada fila es un gesto. las filas pálidas ya fueron mutadas por el aparato.</p>

  <hr class="regla">
  <p class="subtitulo">el mensaje, carácter por carácter</p>
  <p class="mensaje-bits" id="bits"></p>
  <p class="error-util" id="error" hidden></p>
</main>

<nav class="salidas" data-salidas aria-label="salidas de esta página"></nav>
<p class="pie">semilla en la barra de direcciones · <a href="../mapa.html">mapa</a> · <kbd>M</kbd> mapa · <kbd>B</kbd> bitácora · <kbd>Esc</kbd> hueco</p>

<script src="../js/carga.js" data-base="../"></script>
<script>
document.addEventListener('npvs:cargado', function () {
  'use strict';
  const N = window.NPVS;
  N.shell.iniciar({ pagina: 'matriz', espera: 42 });

  const nota = document.getElementById('nota');
  const dmin = document.getElementById('dmin');
  const error = document.getElementById('error');

  const parar = N.regB.matriz(document.getElementById('matriz'), {
    max: 64,
    alSeleccionar: function (reg, vecino) {
      N.mem.hito('un-bit-a-mano', reg.w);
      if (vecino && vecino.d < N.regB.DMIN) {
        nota.textContent = 'ese recuerdo quedó a distancia ' + vecino.d + ' de otro. el aparato ya no puede distinguirlos.';
        error.hidden = false;
        error.textContent = 'error útil: dos recuerdos indistinguibles producen la misma prueba. la prueba dejó de servir.';
      } else {
        nota.textContent = 'recuerdo ' + reg.w + ' · separado de todos por ' + (vecino ? vecino.d : '—');
      }
      pintarBits(); medir();
    }
  });

  function medir() {
    const d = N.regB.distanciaMinima();
    const n = N.mem.d.codigos.length;
    dmin.textContent = n + ' recuerdos · distancia mínima ' + (n < 2 ? '—' : d) + ' · admisible ' + N.regB.DMIN;
    dmin.setAttribute('data-critico', (n >= 2 && d < N.regB.DMIN) ? '1' : '0');
  }
  medir();
  const parar2 = N.bus.on('gesto', medir);

  /* el mensaje mismo, en binario, con los bits apagados marcados */
  function pintarBits() {
    const host = document.getElementById('bits');
    host.innerHTML = '';
    const orig = Array.from(N.corpus.MENSAJE);
    const deg = Array.from(N.texto.mensajeDegradado());
    orig.forEach(function (ch, i) {
      const cp = deg[i] ? deg[i].codePointAt(0) : 32;
      let s = '';
      for (let b = 7; b >= 0; b--) s += ((cp >> b) & 1);
      const span = document.createElement(deg[i] !== ch ? 'b' : 'span');
      span.textContent = s + ' ';
      span.title = ch + ' → ' + (deg[i] || '');
      host.appendChild(span);
    });
  }
  pintarBits();
  N.bus.on('bit', pintarBits);

  N.sonido.control(document.body);
  N.bus.listen(window, 'pagehide', function () { parar(); parar2(); });
});
</script>
</body>
</html>
