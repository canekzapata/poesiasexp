<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>el original · ninguna prueba viaja sola</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/regimes.css">
<link rel="stylesheet" href="../css/print.css">
<style>
  .marco { text-align: center; }
  .ausencia p { font-family: "Micro","Monitor",ui-monospace,monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .45; }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23222'/%3E%3C/svg%3E">
</head>
<body data-pagina="original" class="pagina-original">

<header class="cabeza"><p class="marca"><a href="../index.html">ninguna prueba viaja sola</a> · el original</p></header>
<div class="telemetria" data-telemetria aria-label="telemetría de la señal"></div>

<main>
  <div class="marco">
    <div class="ausencia"><p id="dentro">aquí no hay nada</p></div>
    <p class="medida" id="pie" style="margin-top:1.6rem"></p>
  </div>
</main>

<nav class="salidas" data-salidas aria-label="salidas de esta página"></nav>
<p class="pie">esta dirección no aparece en el mapa · <a href="../mapa.html">mapa</a> · <kbd>Esc</kbd> hueco</p>

<script src="../js/carga.js" data-base="../"></script>
<script>
document.addEventListener('npvs:cargado', function () {
  'use strict';
  const N = window.NPVS;
  N.shell.iniciar({ pagina: 'original', espera: 22 });

  const dentro = document.getElementById('dentro');
  const pie = document.getElementById('pie');

  /* el marco se llena con lo que el recorrido dejó afuera:
     nunca con el mensaje. */
  const perdidos = N.mem.d.fragmentos.filter(function (f) { return f.estado === 'perdido'; });
  const bits = N.texto.bitsPerdidos();

  function actualizar() {
    if (!perdidos.length && !bits) {
      dentro.textContent = 'aquí no hay nada todavía';
      pie.textContent = 'el marco se llena con lo que el recorrido deje afuera. no con el mensaje.';
    } else {
      dentro.textContent = (perdidos[0] ? perdidos[0].texto : (bits + ' bits')) + ' — y no es esto';
      pie.textContent = 'el aparato colocó en el lugar del original lo más parecido que tenía a mano: ' +
        perdidos.length + ' pérdidas y ' + bits + ' bits apagados. la sustitución quedó registrada.';
      N.mem.falso('inferencia', 'original',
        'el marco del original se llenó con residuos porque el aparato no admite un marco vacío');
    }
  }
  actualizar();

  /* esperar aquí borra lo que se puso: el original vuelve a faltar */
  N.bus.inactividad(22, function () {
    dentro.textContent = 'aquí no hay nada';
    pie.textContent = 'la sustitución se deshizo sola. el original volvió a ser lo que es: la parte que no tiene página.';
    N.mem.hito('el-original-volvio-a-faltar', true);
  });

  N.sonido.control(document.body);
});
</script>
</body>
</html>
