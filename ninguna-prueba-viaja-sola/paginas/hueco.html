<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hueco · ninguna prueba viaja sola</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/regimes.css">
<link rel="stylesheet" href="../css/print.css">
<style>
  body.pagina-hueco main { display: grid; place-items: center; min-height: 70svh; }
  .centro { text-align: center; max-width: 30em; }
  .punto { width: 6px; height: 6px; background: var(--papel); border-radius: 50%; margin: 0 auto 3rem; }
  body.pagina-hueco .salidas { border-top-color: color-mix(in srgb, var(--papel) 30%, transparent); }
  body.pagina-hueco .pie { opacity: .35; }
  .cuenta { font-family: "Micro","Monitor",ui-monospace,monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .5; }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23222'/%3E%3C/svg%3E">
</head>
<body data-pagina="hueco" class="pagina-hueco">

<header class="cabeza"><p class="marca"><a href="../index.html">ninguna prueba viaja sola</a> · hueco</p></header>
<div class="telemetria" data-telemetria aria-label="telemetría de la señal"></div>

<main>
  <div class="centro">
    <div class="punto" aria-hidden="true"></div>
    <p id="linea">Esta dirección no hace nada. Es el único lugar de la obra donde no se mide lo que haces.</p>
    <p class="cuenta" id="cuenta"></p>
  </div>
</main>

<nav class="salidas" data-salidas aria-label="salidas de esta página"></nav>
<p class="pie">se sale por donde se entró, o esperando · <a href="../mapa.html">mapa</a></p>

<script src="../js/carga.js" data-base="../"></script>
<script>
document.addEventListener('npvs:cargado', function () {
  'use strict';
  const N = window.NPVS;
  N.shell.iniciar({ pagina: 'hueco', espera: 18 });

  /* mentira parcial: lo único que se mide aquí es cuánto se aguanta */
  let s = 0;
  const cuenta = document.getElementById('cuenta');
  const linea = document.getElementById('linea');
  const parar = N.bus.every(function () {
    s++;
    cuenta.textContent = s + ' segundos de silencio · ' + N.texto.bitsPerdidos() + ' bits apagados';
    if (s === 24) {
      linea.textContent = 'Mentí: se mide cuánto aguantas. Es la medición más barata del aparato y la más difícil de falsificar.';
      N.mem.hito('el-silencio-fue-sostenido', s);
      N.mem.pausa(s);
    }
    if (s === 60) {
      linea.textContent = 'Un minuto. En la bitácora esto va a aparecer como permanencia, igual que si hubieras leído algo. No hay manera de distinguirlo.';
      N.mem.contradiccion('permanencia en el hueco: ' + s + ' s',
        'contenido leído en el hueco: ninguno',
        'la permanencia no distingue leer de esperar');
    }
  }, 1000);

  N.sonido.control(document.body);
  N.bus.listen(window, 'pagehide', parar);
});
</script>
</body>
</html>
