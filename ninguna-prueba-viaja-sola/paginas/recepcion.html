<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>recepción · ninguna prueba viaja sola</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/regimes.css">
<link rel="stylesheet" href="../css/print.css">
<style>
  .campo--franja { height: min(34svh, 20rem); margin-bottom: 1.6rem; }
  .carta { max-width: 34em; min-height: 12em; font-size: 1.05rem; }
  .carta p { margin: 0 0 .7em; }
  .carta .cursor::after { content: "▍"; opacity: .5; }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23222'/%3E%3C/svg%3E">
</head>
<body data-pagina="recepcion" class="pagina-recepcion">

<header class="cabeza"><p class="marca"><a href="../index.html">ninguna prueba viaja sola</a> · recepción</p></header>
<div class="telemetria" data-telemetria aria-label="telemetría de la señal"></div>

<main>
  <h1 class="monumento">LLEGÓ</h1>
  <p class="subtitulo">movimiento I · la página no distingue entre señal, ruido y visitante</p>

  <div class="campo campo--franja" id="campo"><canvas id="lienzo"></canvas></div>
  <div id="vacios"></div>

  <div class="carta suelto" id="carta" aria-live="polite"></div>

  <p class="medida" id="estado-carta">la transmisión sigue entrando. cualquier gesto la interrumpe.</p>
  <p class="error-util" id="error" hidden></p>

  <div class="trama" id="trama"></div>
</main>

<nav class="salidas" data-salidas aria-label="salidas de esta página"></nav>
<p class="pie">semilla en la barra de direcciones · <a href="../mapa.html">mapa</a> · <kbd>M</kbd> mapa · <kbd>B</kbd> bitácora · <kbd>Esc</kbd> hueco</p>

<script src="../js/carga.js" data-base="../"></script>
<script>
document.addEventListener('npvs:cargado', function () {
  'use strict';
  const N = window.NPVS;
  N.shell.iniciar({ pagina: 'recepcion', espera: 34 });

  /* el cuerpo de la señal: pocos cuerpos, un hueco */
  const campo = N.regA.crear(document.getElementById('lienzo'), {
    cuerpos: 18, vacios: 1, cobertura: 0.26,
    alVacio: function (v) {
      const host = document.getElementById('vacios');
      const rect = document.getElementById('lienzo').getBoundingClientRect();
      let a = host.firstChild;
      if (!a) {
        a = document.createElement('a');
        a.className = 'vacio-enlace visible';
        a.href = N.rutas.href('residuo');
        a.setAttribute('data-destino', 'residuo');
        a.setAttribute('aria-label', 'cruzar el vacío hacia el residuo');
        a.addEventListener('click', function () {
          N.rutas.registrarArista('recepcion', 'residuo', 'perdida');
          N.texto.perderBit('otro vacío del campo fue cruzado');
        });
        host.appendChild(a);
      }
      if (!v[0]) { a.style.display = 'none'; return; }
      a.style.display = '';
      const d = Math.max(24, Math.min(v[0].d, 44));
      a.style.left = (rect.left + window.scrollX + v[0].x - d) + 'px';
      a.style.top = (rect.top + window.scrollY + v[0].y - d) + 'px';
      a.style.width = a.style.height = (d * 2) + 'px';
      a.style.position = 'absolute';
    }
  });
  document.getElementById('vacios').style.position = 'relative';

  /* la carta llega tecleándose. la espera la completa; el gesto la corta. */
  const carta = document.getElementById('carta');
  const estado = document.getElementById('estado-carta');
  const lineas = N.corpus.CARTA.slice();
  let i = 0, cortada = false, terminada = false, cancelar = null;

  function siguiente() {
    if (cortada || i >= lineas.length) {
      if (!cortada) {
        terminada = true;
        estado.textContent = 'la transmisión entró completa. nadie la interrumpió.';
        N.mem.hito('la-espera-completo-la-carta', lineas.length);
      }
      return;
    }
    const p = document.createElement('p');
    p.className = 'cursor';
    carta.appendChild(p);
    cancelar = N.texto.teclear(p, lineas[i++], 26, function () {
      p.classList.remove('cursor');
      N.bus.later(siguiente, 620);
    });
  }
  N.bus.later(siguiente, 700);

  function cortar(ev) {
    if (terminada || cortada) return;
    if (ev && ev.target && ev.target.closest && ev.target.closest('a,button,input')) return;
    cortada = true;
    if (cancelar) cancelar();
    const ult = carta.lastElementChild;
    if (ult) { ult.classList.remove('cursor'); ult.textContent = ult.textContent + '—'; }
    estado.textContent = 'la transmisión fue interrumpida en la línea ' + i + ' de ' + lineas.length + '.';
    const err = document.getElementById('error');
    err.hidden = false;
    err.textContent = 'error útil: lo que faltaba de la carta pasó a ser residuo. no vuelve a esta página.';
    N.mem.fragmento({ id: 'carta:' + i, texto: 'las líneas ' + i + '–' + lineas.length + ' de la carta', de: 'recepcion', estado: 'perdido', t: Date.now() });
    N.texto.perderBit('la carta fue interrumpida');
    N.mem.hito('la-interrupcion-tuvo-costo', i);
  }
  N.bus.listen(document, 'pointerdown', cortar);
  N.bus.listen(document, 'keydown', function (ev) { if (ev.key !== 'Tab') cortar(ev); });

  /* microtexto: la telemetría real como trama */
  const t = N.texto.telemetria();
  const tr = [];
  for (let k = 0; k < 90; k++) {
    tr.push(N.corpus.TELEMETRIA[k % N.corpus.TELEMETRIA.length]
      .replace('{t}', t.recibido).replace('{int}', t.integridad).replace('{n}', String(t.cuerpos + k % 7)));
  }
  document.getElementById('trama').textContent = tr.join(' · ');

  N.sonido.control(document.body);
  N.bus.listen(window, 'pagehide', function () { campo && campo.destruir(); });
});
</script>
</body>
</html>
