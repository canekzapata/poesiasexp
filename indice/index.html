<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CANIBALIZA / POESIASEXP</title>
  <meta name="description" content="Una superficie parasitaria que recorta, repite y enlaza órganos vivos de poesiasexp.">
  <link rel="stylesheet" href="collage.css">
</head>
<body>
  <canvas id="strata-field" aria-hidden="true"></canvas>
  <main id="cannibal-world" aria-label="Colisión caníbal de poesiasexp">
    <svg id="vein-field" aria-label="Venas textuales y rutas hacia las obras">
      <defs>
        <filter id="vein-wobble" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency=".008 .025" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
        </filter>
      </defs>
      <g id="veins"></g>
    </svg>
    <svg id="wire-field" aria-hidden="true"><g id="wires"></g></svg>
    <section id="collage" aria-label="Fragmentos vivos enlazados"></section>
    <section id="text-field" aria-label="Texto monumental derramado"></section>
    <section id="rare-windows" aria-label="Ventanas ocasionales"></section>
  </main>
  <button id="regenerate" type="button" aria-label="Otra digestión"></button>

  <!--
    Los donantes se cargan fuera de cuadro, pero siguen vivos.
    Como están en el mismo repositorio/origen, el motor puede leer su canvas y SVG.
  -->
  <aside id="donor-dock" aria-hidden="true">
    <iframe id="donor-estratos" title="donante Estratos"></iframe>
    <iframe id="donor-letras" title="donante Espacio Escultórico"></iframe>
  </aside>

  <script src="../otrorio/js/corpus.js"></script>
  <script src="collage.js"></script>
</body>
</html>
