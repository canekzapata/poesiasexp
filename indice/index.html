<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CANIBALIZA / POESIASEXP</title>
  <meta name="description" content="Una superficie parasitaria que recorta, repite y enlaza órganos vivos de poesiasexp.">
  <link rel="stylesheet" href="canibal.css">
</head>
<body>
  <canvas id="strata-field" aria-hidden="true"></canvas>
  <div id="field-noise" aria-hidden="true"></div>

  <header class="control-strip">
    <strong>POESIASEXP::<span>CANIBALIZA</span></strong>
    <output id="status">buscando órganos…</output>
    <button type="button" data-command="more">+ ventana</button>
    <button type="button" data-command="digest">otra digestión</button>
    <button type="button" data-command="quiet">quiet</button>
  </header>

  <main id="cannibal-world" aria-label="Composición caníbal">
    <svg id="vein-field" aria-label="Venas textuales y rutas hacia las obras">
      <defs>
        <filter id="vein-wobble" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency=".008 .025" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
        </filter>
      </defs>
      <g id="veins"></g>
    </svg>
    <section id="windows" aria-label="Ventanas canibalizadas"></section>
    <section id="spill-field" aria-label="Texto y dibujos derramados"></section>
  </main>

  <nav class="source-index" aria-label="Obras donantes">
    <a href="../estratos/index.html">ESTRATOS ↗</a>
    <a href="../lasletras/index.html">ESPACIO ESCULTÓRICO ↗</a>
    <a href="../otrorio/index.html">OTRO RÍO ↗</a>
    <a href="../laberinto/laberinto/index.html">LABERINTO ↗</a>
    <a href="../poemario/loop-nave/index.html">LOOP NAVE ↗</a>
    <a href="../escape/index.html">ESCAPE ↗</a>
  </nav>

  <!--
    Los donantes se cargan fuera de cuadro, pero siguen vivos.
    Como están en el mismo repositorio/origen, el motor puede leer su canvas y SVG.
  -->
  <aside id="donor-dock" aria-hidden="true">
    <iframe id="donor-estratos" title="donante Estratos"></iframe>
    <iframe id="donor-letras" title="donante Espacio Escultórico"></iframe>
  </aside>

  <script src="../otrorio/js/corpus.js"></script>
  <script src="canibal.js"></script>
</body>
</html>
