<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATLAS DE LO ILEGIBLE · poesiasexp</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  svg { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<!--
  Este archivo no es la obra: es el banco de pruebas.

  La obra es atlas.js — el mismo código que corre en el bootloader SVG-JS
  de bootloader.art, donde el entorno ya provee BTLDR.svg y BTLDR.rnd().
  Aquí abajo se emula ese entorno para poder mirarla fuera de la cadena.

  Como esto NO es la carga on-chain, aquí sí se puede usar Math.random:
  sirve para sortear una semilla nueva en cada visita. En atlas.js no hay
  ni Math.random ni Date.now, y no debe haberlos.

    ?seed=lo-que-quieras   repite exactamente esa excavación
    sin ?seed=             sortea una y la escribe en la URL
    R                      otra semilla
-->
<svg xmlns="http://www.w3.org/2000/svg" id="raiz"></svg>
<script>
/* --- emulación local del bootloader ------------------------------- */
(function () {
  var q = /[?&]seed=([^&#]+)/.exec(location.search);
  var semilla;

  if (q) {
    semilla = decodeURIComponent(q[1]);
  } else {
    /* sin semilla en la URL siempre saldría la misma pieza. se sortea
       una, y se escribe en la barra de direcciones para que la
       excavación siga siendo repetible: el azar queda firmado. */
    semilla = Math.random().toString(36).slice(2, 10);
    try {
      history.replaceState(null, "", location.pathname + "?seed=" + semilla + location.hash);
    } catch (e) { /* file:// a veces no deja reescribir la URL */ }
  }

  var h = 2166136261 >>> 0;
  for (var i = 0; i < semilla.length; i++) { h ^= semilla.charCodeAt(i); h = Math.imul(h, 16777619); }
  var a = h >>> 0;

  window.BTLDR = {
    svg: document.getElementById("raiz"),
    semilla: semilla,
    rnd: function () {
      var t = (a += 0x6d2b79f5) >>> 0;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
  };

  /* R — otra excavación. la tecla no pertenece a la obra: pertenece a
     la mesa donde la obra se está probando. */
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "r" || ev.key === "R") {
      location.search = "?seed=" + Math.random().toString(36).slice(2, 10);
    }
  });
})();
</script>
<script src="atlas.js"></script>
</body>
</html>
